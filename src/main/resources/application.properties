spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

stripe.secret-key=${STRIPE_SECRET}
stripe.webhook-secret=${WEBHOOK_STRIPE_SECRET}

resend.api-key=${RESEND_API_KEY}

login.rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
login.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

server.port=${PORT:8080}